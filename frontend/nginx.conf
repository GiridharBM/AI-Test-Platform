server {
    listen 80;
    server_name _;

    # M16-B security boundary: POST /api/projects/from-path registers
    # filesystem paths. It is a bare-metal/local development API and must NOT
    # be reachable through the containerized topology. Excluded here at the
    # proxy — a regex location beats the prefix /api/ location — covering both
    # the trailing- and non-trailing-slash forms. The backend endpoint is left
    # untouched (still available for local development).
    location ~ ^/api/projects/from-path/?$ {
        return 404;
    }

    # Same-origin API routing to the backend (never host-published).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Compiled React SPA with history-mode fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}